name: Browser integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --include=dev
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8
          cache: true
      - name: Type-check Supabase Edge Function with Deno
        run: deno check --config supabase/functions/ingest-review/deno.json supabase/functions/ingest-review/index.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Benchmark missed-opportunity detection
        run: node tools/benchmark-missed-opportunities.mjs
      - run: npm run test:e2e
        env:
          CI: true


  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: test-only
    steps:
      - uses: actions/checkout@v4
      - name: Test cloud sync migrations on PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role BYPASSRLS;'
          for migration in supabase/migrations/*.sql; do
            case "$migration" in
              *20261126120000_community_game_retention_cron.sql)
                echo "Skipping Supabase-hosted pg_cron migration in stock PostgreSQL service; it is applied and verified on the live Supabase project."
                continue
                ;;
            esac
            psql -v ON_ERROR_STOP=1 -f "$migration" || exit 1
          done
          psql -v ON_ERROR_STOP=1 -f tests/cloud-sync.integration.sql
          psql -v ON_ERROR_STOP=1 -f tests/community-review.integration.sql
          psql -v ON_ERROR_STOP=1 -f tests/community-game.integration.sql
          psql -v ON_ERROR_STOP=1 -f tests/community-request-rate.integration.sql
